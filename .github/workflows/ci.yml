name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Benchmark (budgets in bench/budget.json)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          # The server must not keep the step's stdout open, or the step never ends.
          npx vite preview --port 4173 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          status=0
          timeout 300 node bench/run.cjs || status=$?
          kill $PREVIEW_PID || true
          exit $status
      # Height tiles for every phường of TP.HCM / Hà Nội (#18). Too big for git (~100 MB), so they
      # are generated here and cached between runs; each run continues where the last one stopped.
      - name: Restore height tiles
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: heights-z14
          key: heights-z14-v1-${{ github.run_id }}
          restore-keys: heights-z14-v1-
      - name: Generate height tiles
        if: github.event_name == 'push'
        run: node tools/height-tiles.mjs --out heights-z14 --budget-min 35 --concurrency 8
      - name: Save height tiles
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: heights-z14
          key: heights-z14-v1-${{ github.run_id }}
      - name: Add height tiles to the site
        if: github.event_name == 'push'
        run: mkdir -p dist/heights && cp -r heights-z14 dist/heights/z14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
